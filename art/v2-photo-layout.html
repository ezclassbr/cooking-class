<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EZ Class Cooking Class — Back to childhood</title>
<meta name="viewport" content="width=1080">
<style>
@import url('fonts.css');
:root{--navy:#00275B;--sky:#77ABD9;--mist:#EBF0F2;--yellow:#F2D541;--orange:#F27D16;--m:68px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ddd}
.art{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--navy);font-family:'Montserrat',sans-serif;color:var(--mist)}
.logo{position:absolute;left:var(--m);top:60px;width:76px;height:76px;overflow:hidden}
.logo img{position:absolute;width:110px;left:-17px;top:-23.5px;filter:brightness(0) invert(1)}
h1{position:absolute;left:0;right:0;top:176px;text-align:center;font:800 116px/1 'Poppins';letter-spacing:-.04em;color:var(--mist);text-transform:uppercase;white-space:nowrap}
h1 span{color:var(--yellow)}
.sub{position:absolute;left:0;right:0;top:312px;text-align:center;font:italic 700 60px/1 'Poppins';letter-spacing:-.02em;color:var(--mist)}
.sub b{color:var(--sky);font-weight:700}
.photo{position:absolute;left:var(--m);right:var(--m);top:420px;height:590px;border-radius:36px;overflow:hidden;background:#0A3569;box-shadow:0 24px 50px rgba(0,16,40,.5)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:35% 50%}
.inset{position:absolute;right:calc(var(--m) + 28px);top:742px;width:400px;height:266px;border-radius:28px;overflow:hidden;border:6px solid var(--navy);box-shadow:0 20px 40px rgba(0,16,40,.55);transform:rotate(2.5deg);z-index:3}
.inset img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:calc(var(--m) + 28px);top:446px;background:var(--yellow);color:var(--navy);font:700 15px/1 'Poppins';letter-spacing:.18em;text-transform:uppercase;padding:12px 20px;border-radius:999px;z-index:3}
.photo::after{content:"";position:absolute;inset:0;border-radius:36px;box-shadow:inset 0 0 0 2px rgba(119,171,217,.35)}
.recipe{position:absolute;left:var(--m);right:var(--m);top:1040px;text-align:center;font:800 56px/1 'Poppins';letter-spacing:-.025em;color:var(--mist)}
.recipe em{font-style:normal;color:var(--yellow)}
.info{position:absolute;left:var(--m);right:var(--m);top:1138px;height:144px;border-radius:28px;background:var(--mist);display:flex;align-items:center;box-shadow:0 18px 40px rgba(0,16,40,.45)}
.cell{flex:1;display:flex;flex-direction:column;justify-content:center;height:72px;padding:0 36px}
.cell+.cell{border-left:2px solid rgba(0,39,91,.14)}
.lab{font:600 14px/1 'Poppins';letter-spacing:.2em;text-transform:uppercase;color:#4E85B8;margin-bottom:10px}
.val{font:800 46px/1 'Poppins';letter-spacing:-.02em;color:var(--navy)}
.cell.wide{flex:1.35}
.cell.wide .val{font-size:38px;padding-top:4px}
.accent{position:absolute;left:calc(var(--m) + 36px);top:1138px;width:96px;height:8px;border-radius:0 0 8px 8px;background:var(--orange)}
</style>
</head>
<body>
<div class="art">
  <div class="logo"><img src="logo-ezclass-vazado.png" alt="Ez Class"></div>
  <h1>Cooking <span>Class</span></h1>
  <div class="sub">Back to <b>childhood</b></div>
  <div class="photo"><img src="pie-whole.jpg" alt="Apple pie"></div>
  <div class="inset"><img src="pie-open.webp" alt="Apple pie aberta"></div>
  <div class="recipe">McDonald’s <em>Apple Pie</em></div>
  <div class="info">
    <div class="cell"><div class="lab">Data</div><div class="val">16.10</div></div>
    <div class="cell"><div class="lab">Horário</div><div class="val">19:30</div></div>
    <div class="cell wide"><div class="lab">Online</div><div class="val">Zoom Meeting</div></div>
  </div>
  <div class="accent"></div>
</div>
</body>
</html>
