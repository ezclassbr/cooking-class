<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EZ Class Cooking Class — Back to childhood</title>
<meta name="viewport" content="width=1080">
<style>
@import url('fonts.css');
:root{
  --navy:#00275B; --sky:#77ABD9; --mist:#EBF0F2;
  --yellow:#F2D541; --orange:#F27D16; --black:#000;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ddd}
.art{
  position:relative;width:1080px;height:1350px;overflow:hidden;
  background:var(--navy);font-family:'Montserrat',sans-serif;color:var(--mist);
}
/* checker band – nod to the reference's gingham, in brand blues */
.checker{position:absolute;left:0;bottom:0;width:1080px;height:0}
.chk-left{
  position:absolute;left:0;top:0;width:78px;height:640px;
  background:
    conic-gradient(var(--sky) 25%, transparent 0 50%, var(--sky) 0 75%, transparent 0) 0 0/78px 78px;
  opacity:.9;
}
.chk-right{
  position:absolute;right:0;top:0;width:78px;height:390px;
  background:
    conic-gradient(var(--sky) 25%, transparent 0 50%, var(--sky) 0 75%, transparent 0) 0 0/78px 78px;
  opacity:.9;
}
/* soft light behind the pie */
.glow{position:absolute;left:50%;top:810px;width:980px;height:980px;margin-left:-490px;margin-top:-490px;border-radius:50%;
  background:radial-gradient(circle,#1B5A9E 0%, rgba(27,90,158,.55) 38%, rgba(0,39,91,0) 70%);}
.disc{position:absolute;left:50%;top:810px;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:var(--sky);opacity:.95}

.logo{position:absolute;left:68px;top:62px;width:84px;height:84px;overflow:hidden}
.logo img{position:absolute;width:122px;left:-18.8px;top:-26px;filter:brightness(0) invert(1)}
.brand{position:absolute;left:166px;top:92px;font-size:30px !important;font:700 22px/1.1 'Poppins';letter-spacing:.02em;color:var(--mist)}
.brand small{display:block;font:600 13px 'Montserrat';letter-spacing:.2em;color:var(--sky);margin-top:6px;text-transform:uppercase}

.kicker{position:absolute;right:68px;top:84px;font:600 15px/1 'Poppins';letter-spacing:.22em;text-transform:uppercase;
  color:var(--navy);background:var(--yellow);padding:12px 20px;border-radius:999px}

h1.cc{position:absolute;left:0;right:0;top:170px;text-align:center;font:800 150px/.9 'Poppins';letter-spacing:-.045em;color:var(--mist);text-transform:uppercase}
h1.cc span{display:block}
h1.cc .l2{color:var(--yellow)}

.back{position:absolute;left:0;right:0;top:500px;text-align:center;z-index:6;
  font:italic 700 58px/1 'Poppins';letter-spacing:-.02em;color:var(--mist)}
.back b{font-weight:700;color:var(--yellow)}

.pie{position:absolute;left:50%;top:590px;width:900px;height:500px;margin-left:-450px;z-index:4}
.pie svg{width:100%;height:100%;overflow:visible}

.apple-name{position:absolute;left:0;right:0;top:1088px;text-align:center;z-index:8;
  font:800 62px/1 'Poppins';letter-spacing:-.025em;color:var(--mist);text-shadow:0 4px 0 rgba(0,23,50,.35)}
.apple-name em{font-style:normal;color:var(--yellow)}

.info{position:absolute;left:68px;right:68px;bottom:56px;height:128px;border-radius:28px;background:var(--mist);z-index:9;
  display:flex;align-items:center;box-shadow:0 18px 40px rgba(0,23,50,.45)}
.info .cell{flex:1;padding:0 34px;height:62px;display:flex;flex-direction:column;justify-content:center}
.info .cell+.cell{border-left:2px solid rgba(0,39,91,.15)}
.info .lab{font:600 13px/1 'Poppins';letter-spacing:.2em;text-transform:uppercase;color:var(--sky);margin-bottom:8px;filter:brightness(.78)}
.info .val{font:800 40px/1 'Poppins';letter-spacing:-.02em;color:var(--navy)}
.info .val.sm{font-size:31px}
.info .cell.cta{flex:0 0 auto;border:none;padding:0 30px 0 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--orange);margin-right:10px;vertical-align:middle;position:relative;top:-3px}
</style>
</head>
<body>
<div class="art">
  <div class="chk-left" style="top:780px;height:570px"></div>
  <div class="chk-right" style="top:0"></div>
  <div class="glow"></div>

  <div class="logo"><img src="logo-ezclass-vazado.png" alt=""></div>
  <div class="brand">Ez Class</div>

  <h1 class="cc"><span>Cooking</span><span class="l2">Class</span></h1>

  <div class="disc"></div>
  <div class="back">Back to <b>childhood</b></div>

  <div class="pie">
    <svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F2B94A"/><stop offset=".5" stop-color="#DB8A1F"/><stop offset="1" stop-color="#A4540E"/>
        </linearGradient>
        <linearGradient id="crustEdge" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F0B24A"/><stop offset="1" stop-color="#8F4A12"/>
        </linearGradient>
        <radialGradient id="hi" cx=".28" cy=".18" r=".75">
          <stop offset="0" stop-color="#FFE7A0" stop-opacity=".55"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="filling" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#C5611B"/><stop offset="1" stop-color="#7A3510"/>
        </linearGradient>
        <linearGradient id="appleR" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F58A7B"/><stop offset=".55" stop-color="#E34B3C"/><stop offset="1" stop-color="#A9231E"/>
        </linearGradient>
        <linearGradient id="appleG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E8F0A0"/><stop offset=".6" stop-color="#B7CC4B"/><stop offset="1" stop-color="#7C9B27"/>
        </linearGradient>
        <linearGradient id="sleeve" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FBF4E2"/><stop offset="1" stop-color="#E6D9B8"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
          <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#001732" flood-opacity=".5"/>
        </filter>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#001732" flood-opacity=".35"/>
        </filter>
        <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .4  0 0 0 0 .2  0 0 0 0 .05  0 0 0 .5 0"/></filter>
        <mask id="biteCrust">
          <rect x="-50" y="-50" width="900" height="600" fill="#fff"/>
          <g fill="#000"><circle cx="576" cy="30" r="48"/><circle cx="632" cy="64" r="44"/><circle cx="596" cy="-6" r="42"/><circle cx="662" cy="112" r="36"/></g>
        </mask>
        <mask id="biteInner">
          <rect x="-50" y="-50" width="900" height="600" fill="#fff"/>
          <g fill="#000"><circle cx="576" cy="22" r="40"/><circle cx="632" cy="56" r="36"/><circle cx="596" cy="-14" r="34"/><circle cx="662" cy="104" r="28"/></g>
        </mask>
      </defs>

      <!-- cinnamon sticks -->
      <g transform="translate(40 392) rotate(-20)" filter="url(#soft)">
        <rect width="230" height="28" rx="14" fill="#9A5A2B"/><rect y="4" width="230" height="8" rx="4" fill="#C98648"/>
        <ellipse cx="3" cy="14" rx="8" ry="13" fill="#6E3A16"/><ellipse cx="3" cy="14" rx="4" ry="8" fill="#4A230B"/>
      </g>
      <g transform="translate(70 424) rotate(-6)" filter="url(#soft)">
        <rect width="200" height="24" rx="12" fill="#8A4E22"/><rect y="4" width="200" height="7" rx="3.5" fill="#B97638"/>
        <ellipse cx="3" cy="12" rx="7" ry="11" fill="#5E3012"/><ellipse cx="3" cy="12" rx="3.5" ry="7" fill="#3E1D08"/>
      </g>

      <!-- paper sleeve -->
      <g transform="translate(150 150) rotate(-7)" filter="url(#shadow)">
        <clipPath id="sl"><path d="M0 130 L34 112 L68 130 L102 112 L136 130 L170 112 L204 130 L238 112 L272 130 L306 112 L340 130 L374 112 L408 130 L442 112 L476 130 L510 112 L544 130 L578 112 L612 130 L612 330 L0 330 Z"/></clipPath>
        <path d="M0 130 L34 112 L68 130 L102 112 L136 130 L170 112 L204 130 L238 112 L272 130 L306 112 L340 130 L374 112 L408 130 L442 112 L476 130 L510 112 L544 130 L578 112 L612 130 L612 330 L0 330 Z" fill="url(#sleeve)"/>
        <g clip-path="url(#sl)">
          <rect y="206" width="612" height="20" fill="#77ABD9"/>
          <rect y="234" width="612" height="7" fill="#00275B"/>
          <rect y="248" width="612" height="7" fill="#00275B"/>
          <rect y="264" width="612" height="70" fill="#F27D16"/>
          <rect y="264" width="612" height="70" fill="url(#grain)" opacity=".22"/>
        </g>
      </g>

      <!-- pie -->
      <g transform="translate(130 38) rotate(-7)" filter="url(#shadow)">
        <!-- apple filling visible at the bite -->
        <g mask="url(#biteInner)">
          <rect x="0" y="0" width="640" height="300" rx="78" fill="#E9C777"/>
          <rect x="0" y="0" width="640" height="300" rx="78" fill="#F2DDA0"/>
          <rect x="0" y="0" width="640" height="300" rx="78" fill="url(#filling)" opacity=".55"/>
        </g>
        <g fill="#FBEFB8" stroke="#D9A84E" stroke-width="2"><rect x="560" y="52" width="26" height="16" rx="6" transform="rotate(20 560 52)"/><rect x="604" y="84" width="26" height="16" rx="6" transform="rotate(-18 604 84)"/><rect x="636" y="130" width="22" height="14" rx="6" transform="rotate(30 636 130)"/></g>
        <g mask="url(#biteCrust)">
          <rect x="0" y="0" width="640" height="300" rx="78" fill="url(#crustEdge)"/>
          <rect x="9" y="7" width="622" height="284" rx="70" fill="url(#crust)"/>
          <rect x="9" y="7" width="622" height="284" rx="70" fill="url(#hi)"/>
          <!-- fork-crimped ends -->
          <g stroke="#A05A17" stroke-width="5" stroke-linecap="round" opacity=".55"><path d="M30 120l16 0M28 140l18 0M28 160l18 0M30 180l16 0M594 130l-16 0M596 150l-18 0M596 170l-18 0M594 190l-16 0"/></g>
          <!-- slashes with filling -->
          <g id="slashes">
            <g transform="translate(130 76) rotate(-24)"><rect width="150" height="28" rx="14" fill="url(#filling)"/><rect x="8" y="5" width="134" height="8" rx="4" fill="#EBB566" opacity=".6"/><circle cx="36" cy="18" r="6" fill="#F3D88A"/><circle cx="86" cy="13" r="5" fill="#F7E3A6"/><circle cx="118" cy="18" r="6" fill="#EAC06E"/></g>
            <g transform="translate(230 104) rotate(-24)"><rect width="170" height="28" rx="14" fill="url(#filling)"/><rect x="8" y="5" width="154" height="8" rx="4" fill="#EBB566" opacity=".6"/><circle cx="40" cy="18" r="6" fill="#F7E3A6"/><circle cx="96" cy="13" r="5" fill="#F3D88A"/><circle cx="136" cy="18" r="6" fill="#EAC06E"/></g>
            <g transform="translate(340 132) rotate(-24)"><rect width="170" height="28" rx="14" fill="url(#filling)"/><rect x="8" y="5" width="154" height="8" rx="4" fill="#EBB566" opacity=".6"/><circle cx="36" cy="18" r="6" fill="#F3D88A"/><circle cx="92" cy="13" r="5" fill="#F7E3A6"/><circle cx="132" cy="18" r="6" fill="#EAC06E"/></g>
          </g>
          <g fill="#FFE9A8" opacity=".55">
            <circle cx="90" cy="160" r="6"/><circle cx="150" cy="226" r="5"/><circle cx="270" cy="236" r="7"/><circle cx="410" cy="230" r="5"/><circle cx="520" cy="210" r="6"/><circle cx="214" cy="186" r="4"/><circle cx="398" cy="204" r="4"/><circle cx="130" cy="62" r="4"/><circle cx="560" cy="150" r="5"/>
          </g>
          <g fill="#8E4A12" opacity=".35">
            <circle cx="120" cy="200" r="4"/><circle cx="330" cy="224" r="5"/><circle cx="470" cy="188" r="4"/><circle cx="200" cy="246" r="3"/><circle cx="574" cy="200" r="4"/>
          </g>
          <rect x="9" y="7" width="622" height="284" rx="70" fill="url(#grain)" opacity=".25"/>
        </g>
      </g>

      <!-- apples -->
      <g filter="url(#soft)" transform="translate(690 300) scale(.95)">
        <ellipse cx="80" cy="154" rx="82" ry="16" fill="#001732" opacity=".25"/>
        <path d="M80 28 C40 -6 -2 30 4 88 C10 140 48 168 80 160 C112 168 150 140 156 88 C162 30 120 -6 80 28 Z" fill="url(#appleR)"/>
        <path d="M80 28 C78 14 82 4 92 -6" stroke="#5C3A1A" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M92 6 C110 -14 138 -12 148 -4 C136 14 108 18 92 6 Z" fill="#6E9A2B"/>
        <ellipse cx="46" cy="64" rx="14" ry="26" fill="#fff" opacity=".28" transform="rotate(20 46 64)"/>
      </g>
      <g filter="url(#soft)" transform="translate(6 236) scale(.72)">
        <ellipse cx="80" cy="154" rx="82" ry="16" fill="#001732" opacity=".25"/>
        <path d="M80 28 C40 -6 -2 30 4 88 C10 140 48 168 80 160 C112 168 150 140 156 88 C162 30 120 -6 80 28 Z" fill="url(#appleG)"/>
        <path d="M80 28 C78 14 82 4 92 -6" stroke="#5C3A1A" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M92 6 C110 -14 138 -12 148 -4 C136 14 108 18 92 6 Z" fill="#4F7A1E"/>
        <ellipse cx="46" cy="64" rx="14" ry="26" fill="#fff" opacity=".35" transform="rotate(20 46 64)"/>
      </g>
      <g filter="url(#soft)">
        <g transform="translate(626 376) rotate(18)"><path d="M0 38 C0 -6 66 -6 66 38 C52 20 14 20 0 38 Z" fill="#FBF3C9"/><path d="M4 36 C12 22 52 22 62 36" fill="none" stroke="#E5C46A" stroke-width="3"/></g>
        <g transform="translate(584 410) rotate(-12)"><path d="M0 38 C0 -6 66 -6 66 38 C52 20 14 20 0 38 Z" fill="#FFF8D6"/><path d="M4 36 C12 22 52 22 62 36" fill="none" stroke="#E5C46A" stroke-width="3"/></g>
      </g>
    </svg>
  </div>

  <div class="apple-name">McDonald’s <em>Apple Pie</em></div>

  <div class="info">
    <div class="cell"><div class="lab">Data</div><div class="val">16.10</div></div>
    <div class="cell"><div class="lab">Horário</div><div class="val">19:30</div></div>
    <div class="cell" style="flex:1.5"><div class="lab">Online</div><div class="val sm">Zoom Meeting</div></div>
  </div>
</div>
</body>
</html>
