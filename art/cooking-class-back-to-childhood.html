<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>EZ Class Cooking Class — Back to childhood</title>
<meta name="viewport" content="width=1080">
<style>
@import url('fonts.css');
:root{--navy:#00275B;--sky:#77ABD9;--mist:#EBF0F2;--yellow:#F2D541;--orange:#F27D16;--black:#000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#ccc}
.art{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--mist);font-family:'Montserrat',sans-serif;color:var(--navy)}

/* papel: grão suave no fundo */
.grain{position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;pointer-events:none;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='500' height='500'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' seed='2'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .5  0 0 0 0 .55  0 0 0 .22 0'/></filter><rect width='500' height='500' filter='url(%23f)'/></svg>")}
/* papel amassado (usado em etiquetas laranja e azul) */
.crinkle{position:relative}
.crinkle::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.95;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='c' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.018 .026' numOctaves='5' seed='7' result='n'/><feDiffuseLighting in='n' lighting-color='%23ffffff' surfaceScale='5'><feDistantLight azimuth='235' elevation='48'/></feDiffuseLighting></filter><rect width='600' height='600' filter='url(%23c)'/></svg>");
 background-size:600px 600px}

/* quadriculado (piquenique) */
.gingham{position:absolute;right:0;bottom:0;width:430px;height:210px;
 background:conic-gradient(var(--sky) 25%,transparent 0 50%,var(--sky) 0 75%,transparent 0) 0 0/84px 84px;opacity:.85}
.gingham2{position:absolute;left:0;top:560px;width:44px;height:336px;
 background:conic-gradient(var(--orange) 25%,transparent 0 50%,var(--orange) 0 75%,transparent 0) 0 0/56px 56px;opacity:.9}

.logo{position:absolute;right:56px;top:46px;width:118px;height:134px;overflow:hidden;z-index:12}
.logo img{position:absolute;width:150px;left:-17px;top:-14px}

/* título em papel laranja amassado */
.title{position:absolute;left:46px;top:96px;transform:rotate(-4deg);transform-origin:left top;z-index:6}
.tb{display:block;width:max-content;background:var(--orange);color:#fff;font:900 148px/.9 'Poppins';letter-spacing:-.045em;text-transform:uppercase;
 padding:20px 40px 22px;box-shadow:0 14px 26px rgba(0,39,91,.28)}
.tb.b2{margin-left:150px;margin-top:-1px}
.tb span{position:relative;z-index:2}

.pin{position:absolute;left:772px;top:34px;z-index:8;transform:rotate(-8deg)}

/* faixa azul */
.strip{position:absolute;right:42px;top:438px;z-index:7;transform:rotate(2.2deg);background:var(--navy);color:var(--mist);
 font:italic 800 64px/1 'Poppins';letter-spacing:-.025em;padding:16px 38px 20px;box-shadow:0 14px 26px rgba(0,39,91,.35)}
.strip b{color:var(--yellow);font-weight:800}

/* polaroids */
.pola{position:absolute;background:#fff;box-shadow:0 22px 44px rgba(0,39,91,.38),0 3px 6px rgba(0,39,91,.2)}
.pola img{display:block;width:100%;object-fit:cover}
.pola.main{left:50px;top:530px;width:790px;padding:18px;transform:rotate(-3.5deg);z-index:4}
.pola.main img{height:484px;object-position:50% 50%}
.pola.alt{right:36px;top:836px;width:420px;padding:14px 14px 44px;transform:rotate(4.5deg);z-index:5}
.pola.alt img{height:268px;object-position:40% 60%}
.tape{position:absolute;width:150px;height:44px;background:rgba(242,213,65,.82);box-shadow:0 2px 4px rgba(0,0,0,.12);z-index:9}
.tape.t1{left:36px;top:516px;transform:rotate(-38deg)}
.tape.t2{left:668px;top:822px;transform:rotate(30deg);width:120px;background:rgba(119,171,217,.8)}

/* nome da receita */
.recipe{position:absolute;left:30px;top:978px;z-index:10;transform:rotate(-3.5deg);background:var(--navy);color:var(--mist);
 font:800 46px/1 'Poppins';letter-spacing:-.025em;padding:14px 30px 18px;border-radius:14px;box-shadow:0 14px 26px rgba(0,39,91,.35)}
.recipe em{font-style:normal;color:var(--yellow)}

/* nota adesiva com as informações */
.note{position:absolute;left:58px;top:1094px;width:590px;height:212px;z-index:11;transform:rotate(-2deg);
 background:linear-gradient(180deg,#F6E064,#F2D541);padding:26px 40px;box-shadow:0 20px 34px rgba(0,39,91,.32);display:flex;flex-direction:column;justify-content:center;gap:12px}
.note::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0))}
.row{display:flex;align-items:center;gap:16px;font-family:'Poppins';color:var(--navy)}
.row svg{width:38px;height:38px;flex:none;stroke:var(--navy);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.row.big{font-weight:900;font-size:80px;line-height:1;letter-spacing:-.04em}
.row.big svg{width:54px;height:54px}
.row.mid{font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em}
.row.sm{font-weight:700;font-size:30px;line-height:1;letter-spacing:-.01em}
.circle{position:absolute;left:44px;top:12px;width:240px;height:100px;z-index:12}
</style>
</head>
<body>
<div class="art">
  <div class="grain"></div>
  <div class="gingham"></div>
  <div class="gingham2"></div>

  <div class="logo"><img src="logo-ezclass-full.png" alt="Ez Class"></div>

  <div class="title">
    <span class="tb b1 crinkle"><span>Cooking</span></span>
    <span class="tb b2 crinkle"><span>Class</span></span>
  </div>

  <svg class="pin" width="86" height="110" viewBox="0 0 86 110">
    <defs><radialGradient id="pg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFC27A"/><stop offset=".5" stop-color="#F27D16"/><stop offset="1" stop-color="#B8520A"/></radialGradient></defs>
    <ellipse cx="46" cy="102" rx="22" ry="5" fill="rgba(0,0,0,.25)"/>
    <path d="M44 62 L50 100" stroke="#6b6b6b" stroke-width="5" stroke-linecap="round"/>
    <rect x="20" y="40" width="50" height="22" rx="8" fill="url(#pg)"/>
    <path d="M30 40 L34 12 H56 L60 40 Z" fill="url(#pg)"/>
    <ellipse cx="45" cy="12" rx="17" ry="9" fill="#FFB36B"/>
    <ellipse cx="40" cy="10" rx="6" ry="3" fill="#fff" opacity=".6"/>
  </svg>

  <div class="strip crinkle">Back to <b>childhood</b></div>

  <div class="pola main"><img src="pie-whole.jpg" alt="Apple pie"></div>
  <div class="pola alt"><img src="pie-open.webp" alt="Apple pie aberta"></div>
  <div class="tape t1"></div><div class="tape t2"></div>

  <div class="recipe">McDonald’s <em>Apple Pie</em></div>

  <div class="note">
    <div class="row big"><svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>16.10</div>
    <div class="row mid"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>19:30</div>
    <div class="row sm"><svg viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>Online · Zoom Meeting</div>
  </div>
  <svg class="circle" viewBox="0 0 240 100" fill="none" stroke="#F27D16" stroke-width="5" stroke-linecap="round" style="left:140px;top:1072px;width:290px;height:122px;transform:rotate(-2deg)"><path d="M18 60 C10 24 120 4 214 22 C268 34 262 84 150 94 C70 100 20 90 24 52"/></svg>
</div>
</body>
</html>
